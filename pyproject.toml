[project]
name = "cc3po-ai-q3-llms-agents-retrieval"
version = "0.3.0"
description = "CC3PO AI Builders -- Q3 scaffold: LLMs, agents, and retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Carlos Cabrales", email = "legal@cc3po.com" }]

# All light. Every one of these installs in seconds.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.24",
    "pytest>=7.4",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
# ChromaDB is OPTIONAL on purpose. The default RAG path uses the pure
# numpy vector store in src/vectorstore.py -- zero install friction, no
# server to run, and every concept is visible in ~200 lines.
# Enable it when you want to show students a real vector database.
chroma = ["chromadb>=0.4"]

dev = [
    "pytest>=7.4",
    "nbclient>=0.9",
    "nbformat>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
